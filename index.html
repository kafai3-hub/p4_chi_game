<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小四中文小測 - 滑鼠拖曳版</title>
<style>
* { box-sizing: border-box; }
body { font-family: "PingFang HK", "Microsoft JhengHei", sans-serif; margin: 0; background: #f5f7fa; color: #333; }
header { background: #2c3e50; color: white; padding: 1rem; text-align: center; }
nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin: 1rem; }
nav button { padding: 0.7rem 1.2rem; border: none; background: #3498db; color: white; border-radius: 6px; cursor: pointer; font-size: 1rem; }
nav button.active { background: #2980b9; }
.section { display: none; max-width: 900px; margin: 1rem auto; padding: 1rem; background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.section.active { display: block; }
h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 0.4rem; }
.quiz-part { margin: 1.2rem 0; padding: 1rem; background: #f8f9fa; border-radius: 8px; }
.source-row, .answer-line { display: flex; flex-wrap: wrap; gap: 0.4rem; min-height: 50px; padding: 0.6rem; border-radius: 6px; margin: 0.5rem 0; }
.source-row { background: #ecf0f1; border: 1px solid #bdc3c7; }
.answer-line { background: #e8f6f3; border: 2px dashed #27ae60; }
.answer-line:empty::before { content: "把詞語拖到這裡"; color: #95a5a6; font-style: italic; }
.drag-item { background: #fff; padding: 0.5rem 0.8rem; border: 1px solid #3498db; border-radius: 6px; cursor: grab; user-select: none; }
.drag-item:active { cursor: grabbing; opacity: 0.7; }
.drag-item.over { border-color: #e74c3c; }
button.submit { background: #27ae60; color: white; padding: 0.8rem 1.5rem; border: none; border-radius: 6px; font-size: 1.1rem; margin: 1rem 0; cursor: pointer; }
.result { margin-top: 1rem; padding: 1rem; background: #e8f6f3; border-radius: 6px; display: none; }
.result.show { display: block; }
.correct { color: #27ae60; font-weight: bold; }
.wrong { color: #e74c3c; font-weight: bold; }
.passage { background: #fff; padding: 1rem; border-left: 4px solid #3498db; margin: 1rem 0; line-height: 1.7; }
.question { margin: 1rem 0; }
.mcq label { display: block; margin: 0.3rem 0; padding: 0.4rem; background: #f8f9fa; border-radius: 4px; cursor: pointer; }
input[type="text"] { padding: 0.5rem; width: 100%; max-width: 280px; font-size: 1rem; }
.dashboard-card { font-size: 0.85rem; padding: 0.6rem; margin: 0.4rem 0; background: #fff; border: 1px solid #ddd; border-radius: 6px; }
.log-item { font-size: 0.75rem; margin: 0.2rem 0; padding: 0.3rem; background: #fff3cd; border-radius: 4px; }
.score { font-size: 1.1rem; font-weight: bold; }
</style>
</head>
<body>
<header>
  <h1>小四中文小測</h1>
  <p>每一小測：4題重組句子 + 4題排句成段 + 2篇閱讀理解 | 滑鼠拖曳版</p>
</header>

<nav>
  <button onclick="showSection('quiz1', this)" class="active">小測 1</button>
  <button onclick="showSection('quiz2', this)">小測 2</button>
  <button onclick="showSection('dashboard', this)">答題總結</button>
</nav>

<div id="quiz1" class="section active">
  <h2>小測 1</h2>
  <div id="q1content"></div>
  <button class="submit" onclick="submitQuiz(1)">提交小測 1 並查看答案</button>
  <div id="q1result" class="result"></div>
</div>

<div id="quiz2" class="section">
  <h2>小測 2</h2>
  <div id="q2content"></div>
  <button class="submit" onclick="submitQuiz(2)">提交小測 2 並查看答案</button>
  <div id="q2result" class="result"></div>
</div>

<div id="dashboard" class="section">
  <h2 style="font-size:1.1rem;">答題總結</h2>
  <div id="dashContent">載入中...</div>
  <button onclick="clearLogs()" style="font-size:0.85rem; padding:0.4rem 0.8rem; margin-top:0.5rem;">清除所有紀錄</button>
</div>

<script>
const STORAGE_KEY = 'p4chinese_logs';
function getLogs() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
function saveLog(entry) {
  const logs = getLogs();
  logs.push({ ...entry, time: new Date().toLocaleString('zh-HK') });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
}

function showSection(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (btn) btn.classList.add('active');
  if (id === 'dashboard') renderDashboard();
}

function clearLogs() {
  if (confirm('確定清除所有作答紀錄？')) {
    localStorage.removeItem(STORAGE_KEY);
    renderDashboard();
  }
}

function renderDashboard() {
  const logs = getLogs();
  const div = document.getElementById('dashContent');
  if (logs.length === 0) {
    div.innerHTML = '<p>尚無作答紀錄。</p>';
    return;
  }
  const bySection = {};
  logs.forEach(l => {
    if (!bySection[l.section]) bySection[l.section] = { total: 0, correct: 0, wrongs: [] };
    bySection[l.section].total++;
    if (l.correct) bySection[l.section].correct++;
    else bySection[l.section].wrongs.push(l);
  });
  let html = `<div class="score">總作答次數：${logs.length}</div>`;
  Object.keys(bySection).forEach(sec => {
    const s = bySection[sec];
    const rate = Math.round(s.correct / s.total * 100);
    html += `<div class="dashboard-card"><strong>${sec}</strong><br>正確率：${rate}% (${s.correct}/${s.total})`;
    if (s.wrongs.length) {
      html += '<div style="margin-top:0.4rem;"><small>最近錯誤：</small>';
      s.wrongs.slice(-3).forEach(w => {
        html += `<div class="log-item">${w.time} - ${w.detail || ''}</div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });
  div.innerHTML = html;
}

// 重組句子資料
const reorderData = [
  { id: 1, parts: ['老師', '耐心', '經過', '我', '指導', '的', '終於', '明白', '，', '。'], answer: '經過老師耐心的指導，我終於明白。', explain: '先講「經過老師的指導」，再講結果「我終於明白」。' },
  { id: 2, parts: ['煙花', '夜空', '五彩', '點綴', '的', '美麗', '極了', '，', '。'], answer: '五彩的煙花點綴夜空，美麗極了。', explain: '形容詞「五彩的」修飾「煙花」，再描述效果。' },
  { id: 3, parts: ['專題', '為了', '報告', '我們', '完成', '了', '許多', '資料', '搜集', '，', '。'], answer: '為了完成專題報告，我們搜集了許多資料。', explain: '「為了」引導目的，再寫行動。' },
  { id: 4, parts: ['妹妹', '滿足', '地', '吃着', '蛋糕', '感到', '很', '生日', '，', '。'], answer: '妹妹滿足地吃着生日蛋糕，感到很滿足。', explain: '注意「生日蛋糕」是完整名詞。' },
  { id: 5, parts: ['危急', '關頭', '在', '他', '幫了', '我', '一個', '大忙', '，', '我', '十分', '感激', '他', '。'], answer: '在危急關頭，他幫了我一個大忙，我十分感激他。', explain: '時間狀語放前面。' },
  { id: 6, parts: ['弟弟', '膽小', '怕事', '，', '不肯', '嘗試', '新事物', '，', '常常', '躲在', '媽媽', '身後', '。'], answer: '弟弟膽小怕事，不肯嘗試新事物，常常躲在媽媽身後。', explain: '性格描述 + 行為結果。' },
  { id: 7, parts: ['圖書館', '安靜', '的', '環境', '讓', '我', '可以', '專心', '溫習', '，', '。'], answer: '圖書館安靜的環境讓我可以專心溫習。', explain: '主語是「環境」，使役動詞「讓」。' },
  { id: 8, parts: ['下雨天', '我們', '改', '在', '室內', '進行', '體育課', '，', '以免', '弄濕', '衣服', '。'], answer: '下雨天我們改在室內進行體育課，以免弄濕衣服。', explain: '因果關係：因為下雨所以改地點。' }
];

  { id: 5, sentences: [

  { id: 6, sentences: [

    {k:'B', t:'保護環境是每個人的責任。'},
    {k:'C', t:'他希望更多同學都能養成這個好習慣。'},

  ], answer: 'B A D C', explain: '總述 → 具體行動 → 效果 → 期望。' },
  { id: 7, sentences: [
    {k:'A', t:'我們先參觀了恐龍化石展。'},
    {k:'B', t:'上星期六一家人去了科學館。'},
    {k:'C', t:'接着又看了有趣的科學實驗表演。'},

  ], answer: 'B A C D', explain: '時間順序：去 → 先做 → 接着 → 總結。' },
  { id: 8, sentences: [
    {k:'A', t:'但是只要堅持練習，一定會進步。'},
    {k:'B', t:'剛開始學游泳時，我覺得很困難。'},

// 閱讀資料（精簡）
const readings = [
  {
    id: 1, title: '香江麵包店',
    passage: `十月五日　星期六\n我家附近有一家新開的麵包店，叫香江麵包店。...（完整內容同前）`,
    questions: [
      { type: 'fill', q: '祖母手上那顆鑽石戒子，十分______。', ans: '耀目', explain: '文中用「耀目的珍珠」。' },
      { type: 'mcq', q: '這篇文章的主旨是甚麼？', options: ['A. 介紹特色', 'B. 五感體驗', 'C. 記述所見所聞', 'D. 為妹妹挑選'], ans: 'C', explain: '日記形式記錄逛店。' }
    ]
  },
  {
    id: 2, title: '小麻雀的故事',
    passage: `一個寒冷的中午，小麻雀躲在樹上的鳥窩裏...（完整內容同前）`,
    questions: [
      { type: 'fill', q: '爸爸(　　)地告誡我。', ans: '語重心長', explain: '山羊語重心長地說。' },
      { type: 'mcq', q: '為甚麼小麻雀不起牀？', options: ['A. 下雪', 'B. 生病', 'C. 沒喚醒', 'D. 沒有朋友'], ans: 'D', explain: '沒有朋友，孤單沉悶。' }
    ]
  },
  {
    id: 3, title: '校園清潔日',
    passage: `上星期五是學校的清潔日...`,
    questions: [
      { type: 'fill', q: '老師______地說。', ans: '溫柔', explain: '溫柔地說。' },
      { type: 'mcq', q: '主旨是甚麼？', options: ['A. 介紹活動', 'B. 責任感', 'C. 批評', 'D. 讚美'], ans: 'B', explain: '強調責任。' }
    ]
  },
  {
    id: 4, title: '海洋公園之旅',
    passage: `暑假的一天，爸爸帶我和妹妹去海洋公園...`,
    questions: [
      { type: 'fill', q: '還能______音樂跳舞。', ans: '跟着', explain: '跟著音樂。' },
      { type: 'mcq', q: '主旨是甚麼？', options: ['A. 介紹設施', 'B. 一家人開心', 'C. 可怕', 'D. 可愛'], ans: 'B', explain: '一家人出遊快樂。' }
    ]
  }
];

const quizzes = [
  { id: 1, reorder: [0,1,2,3], para: [0,1,2,3], readings: [0,1] },
  { id: 2, reorder: [4,5,6,7], para: [4,5,6,7], readings: [2,3] }
];

// 拖曳功能
let draggedItem = null;

function makeDraggable(item) {
  item.draggable = true;
  item.addEventListener('dragstart', (e) => {
    draggedItem = item;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => item.style.opacity = '0.5', 0);
  });
  item.addEventListener('dragend', () => {
    item.style.opacity = '1';
    draggedItem = null;
  });
}

function setupDropZone(zone) {
  zone.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    if (!draggedItem) return;
    const afterElement = getDragAfterElement(zone, e.clientX);
    if (afterElement == null) {
      zone.appendChild(draggedItem);
    } else {
      zone.insertBefore(draggedItem, afterElement);
    }
  });
}

function getDragAfterElement(container, x) {
  const draggableElements = [...container.querySelectorAll('.drag-item:not(.dragging)')];
  return draggableElements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = x - box.left - box.width / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset: offset, element: child };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function initQuiz(quizId) {
  const q = quizzes.find(x => x.id === quizId);
  const cont = document.getElementById(`q${quizId}content`);
  cont.innerHTML = '';

  // 重組句子 - 上方來源 + 下方答題線
  const reorderPart = document.createElement('div');
  reorderPart.className = 'quiz-part';
  reorderPart.innerHTML = '<h3>一、重組句子（從上方拖到下方答題線，可左右調整）</h3>';
  const reorderCont = document.createElement('div');
  reorderCont.id = 'reorderQ' + quizId;
  reorderPart.appendChild(reorderCont);
  cont.appendChild(reorderPart);

  q.reorder.forEach((idx, i) => {
    const data = reorderData[idx];
    const div = document.createElement('div');
    div.innerHTML = `<h4>第 ${i+1} 題</h4>
      <div class="source-row" id="source${quizId}_${i}"></div>
      <div class="answer-line" id="target${quizId}_${i}"></div>`;
    reorderCont.appendChild(div);

    const source = document.getElementById(`source${quizId}_${i}`);
    const target = document.getElementById(`target${quizId}_${i}`);
    setupDropZone(source);
    setupDropZone(target);

    const shuffled = [...data.parts].sort(() => Math.random() - 0.5);
    shuffled.forEach(p => {
      const item = document.createElement('div');
      item.className = 'drag-item';
      item.textContent = p;
      makeDraggable(item);
      source.appendChild(item);
    });
  });

  // 排句成段（同樣拖曳）
  const paraPart = document.createElement('div');
  paraPart.className = 'quiz-part';
  paraPart.innerHTML = '<h3>二、排句成段（拖曳排列）</h3>';
  const paraCont = document.createElement('div');
  paraCont.id = 'paraQ' + quizId;
  paraPart.appendChild(paraCont);
  cont.appendChild(paraPart);

  q.para.forEach((idx, i) => {
    const data = paraData[idx];
    const div = document.createElement('div');
    div.innerHTML = `<h4>第 ${i+1} 題</h4><div class="answer-line" id="para${quizId}_${i}"></div>`;
    paraCont.appendChild(div);
    const list = document.getElementById(`para${quizId}_${i}`);
    setupDropZone(list);
    const shuffled = [...data.sentences].sort(() => Math.random() - 0.5);
    shuffled.forEach(s => {
      const item = document.createElement('div');
      item.className = 'drag-item';
      item.dataset.key = s.k;
      item.textContent = `${s.k}. ${s.t}`;
      makeDraggable(item);
      list.appendChild(item);
    });
  });

  // 閱讀理解（簡化）
  const readPart = document.createElement('div');
  readPart.className = 'quiz-part';
  readPart.innerHTML = '<h3>三、閱讀理解</h3><p>（閱讀題目內容與之前相同）</p>';
  cont.appendChild(readPart);
}

function submitQuiz(quizId) {
  const q = quizzes.find(x => x.id === quizId);
  let html = '<h3>小測結果與解釋</h3>';
  let totalCorrect = 0;
  let totalQ = 0;

  html += '<h4>重組句子</h4>';
  q.reorder.forEach((idx, i) => {
    const data = reorderData[idx];
    const list = document.getElementById(`target${quizId}_${i}`);
    const user = Array.from(list.children).map(c => c.textContent).join('');
    const isCorrect = user === data.answer;
    if (isCorrect) totalCorrect++;
    totalQ++;
    html += `<p>第 ${i+1} 題：${isCorrect ? '<span class="correct">正確</span>' : '<span class="wrong">錯誤</span>'}<br>
      你的答案：${user}<br>正確答案：${data.answer}<br>解釋：${data.explain}</p>`;
    saveLog({ section: `小測${quizId}-重組`, correct: isCorrect, detail: `第${i+1}題：${user}` });
  });

  html += '<h4>排句成段</h4>';
  q.para.forEach((idx, i) => {
    const data = paraData[idx];
    const list = document.getElementById(`para${quizId}_${i}`);
    const user = Array.from(list.children).map(c => c.dataset.key).join(' ');
    const isCorrect = user === data.answer;
    if (isCorrect) totalCorrect++;
    totalQ++;
    html += `<p>第 ${i+1} 題：${isCorrect ? '<span class="correct">正確</span>' : '<span class="wrong">錯誤</span>'}<br>
      你的順序：${user}<br>正確順序：${data.answer}<br>解釋：${data.explain}</p>`;
    saveLog({ section: `小測${quizId}-排句`, correct: isCorrect, detail: `第${i+1}題：${user}` });
  });

  html = `<div class="score">小測 ${quizId} 得分：${totalCorrect}/${totalQ}</div>` + html;
  document.getElementById(`q${quizId}result`).innerHTML = html;
  document.getElementById(`q${quizId}result`).classList.add('show');
}

window.onload = function() {
  initQuiz(1);
  initQuiz(2);
  renderDashboard();
};
</script>

</html>
