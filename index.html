<script>
const STORAGE_KEY = 'p4chinese_logs';

function getLogs() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
function saveLog(entry) {
  const logs = getLogs();
  logs.push({ ...entry, time: new Date().toLocaleString('zh-HK') });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
}

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
  if (id === 'dashboard') renderDashboard();
}

function clearLogs() {
  if (confirm('確定清除所有作答紀錄？')) {
    localStorage.removeItem(STORAGE_KEY);
    renderDashboard();
  }
}

function renderDashboard() {
  const logs = getLogs();
  const div = document.getElementById('dashContent');
  if (logs.length === 0) {
    div.innerHTML = '<p>尚無作答紀錄。</p>';
    return;
  }
  const bySection = {};
  logs.forEach(l => {
    if (!bySection[l.section]) bySection[l.section] = { total: 0, correct: 0, wrongs: [] };
    bySection[l.section].total++;
    if (l.correct) bySection[l.section].correct++;
    else bySection[l.section].wrongs.push(l);
  });
  let html = `<div class="score">總作答次數：${logs.length}</div>`;
  Object.keys(bySection).forEach(sec => {
    const s = bySection[sec];
    const rate = Math.round(s.correct / s.total * 100);
    html += `<div class="dashboard-card"><strong>${sec}</strong><br>正確率：${rate}% (${s.correct}/${s.total})`;
    if (s.wrongs.length) {
      html += '<div style="margin-top:0.5rem;"><small>最近錯誤：</small>';
      s.wrongs.slice(-3).forEach(w => {
        html += `<div class="log-item">${w.time} - ${w.detail || ''}</div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });
  div.innerHTML = html;
}

      { type: 'mcq', q: '文章的主旨是甚麼？', options: ['A. 介紹海洋公園的設施。', 'B. 描述一家人開心的一天。', 'C. 說明過山車很可怕。', 'D. 讚美熊貓很可愛。'], ans: 'B', explain: '重點在一家人一起出遊的快樂。' }
    ]
  }
];

// 小測分組：小測1 用前4重組+前4排句+前2閱讀；小測2 用後4+後4+後2閱讀
const quizzes = [
  { id: 1, reorder: [0,1,2,3], para: [0,1,2,3], readings: [0,1] },
  { id: 2, reorder: [4,5,6,7], para: [4,5,6,7], readings: [2,3] }
];

function initQuiz(quizId) {
  const q = quizzes.find(x => x.id === quizId);
  const cont = document.getElementById(`q${quizId}content`);
  cont.innerHTML = '';

  // 重組句子
  const reorderPart = document.createElement('div');
  reorderPart.className = 'quiz-part';
  reorderPart.innerHTML = '<h3>一、重組句子（4題）</h3><div id="reorderQ' + quizId + '"></div>';
  cont.appendChild(reorderPart);
  q.reorder.forEach((idx, i) => {
    const data = reorderData[idx];
    const div = document.createElement('div');
    div.innerHTML = `<h4>第 ${i+1} 題</h4>
      <div class="sortable reorder-row" id="source${quizId}_${i}"></div>
      <div class="answer-zone empty sortable" id="target${quizId}_${i}"></div>`;
    document.getElementById(`reorderQ${quizId}`).appendChild(div);
    const source = document.getElementById(`source${quizId}_${i}`);
    const target = document.getElementById(`target${quizId}_${i}`);
    const shuffled = [...data.parts].sort(() => Math.random() - 0.5);
    shuffled.forEach(p => {
      const item = document.createElement('div');
      item.className = 'item';
      item.textContent = p;
      source.appendChild(item);
    });
    new Sortable(source, { 
      group: 'reorder' + quizId + i, 
      animation: 150,
      sort: true
    });
    new Sortable(target, { 
      group: 'reorder' + quizId + i, 
      animation: 150,
      sort: true,
      onAdd: function() { target.classList.remove('empty'); },
      onRemove: function() { if (target.children.length === 0) target.classList.add('empty'); }
    });
  });

  // 排句成段
  const paraPart = document.createElement('div');
  paraPart.className = 'quiz-part';
  paraPart.innerHTML = '<h3>二、排句成段（4題）</h3><div id="paraQ' + quizId + '"></div>';
  cont.appendChild(paraPart);
  q.para.forEach((idx, i) => {
    const data = paraData[idx];
    const div = document.createElement('div');
    div.innerHTML = `<h4>第 ${i+1} 題</h4><div class="sortable" id="para${quizId}_${i}"></div>`;
    document.getElementById(`paraQ${quizId}`).appendChild(div);
    const list = document.getElementById(`para${quizId}_${i}`);
    const shuffled = [...data.sentences].sort(() => Math.random() - 0.5);
    shuffled.forEach(s => {
      const item = document.createElement('div');
      item.className = 'sentence';
      item.dataset.key = s.k;
      item.textContent = `${s.k}. ${s.t}`;
      list.appendChild(item);
    });
    new Sortable(list, { animation: 150 });
  });

  // 閱讀理解
  const readPart = document.createElement('div');
  readPart.className = 'quiz-part';
  readPart.innerHTML = '<h3>三、閱讀理解（2篇）</h3><div id="readQ' + quizId + '"></div>';
  cont.appendChild(readPart);
  q.readings.forEach((idx, ri) => {
    const r = readings[idx];
    let html = `<h4>閱讀 ${ri+1}：${r.title}</h4><div class="passage">${r.passage.replace(/\n/g, '<br>')}</div>`;
    r.questions.forEach((qq, qi) => {
      html += `<div class="question"><strong>${qi+1}. ${qq.q}</strong><br>`;
      if (qq.type === 'fill') {
        html += `<input type="text" id="ans${quizId}_${ri}_${qi}" placeholder="請填寫">`;
      } else if (qq.type === 'mcq') {
        qq.options.forEach(opt => {
          const letter = opt[0];
          html += `<label class="mcq"><input type="radio" name="q${quizId}_${ri}_${qi}" value="${letter}"> ${opt}</label>`;
        });
      }
      html += '</div>';
    });
    document.getElementById(`readQ${quizId}`).innerHTML += html;
  });
}

function submitQuiz(quizId) {
  const q = quizzes.find(x => x.id === quizId);
  let html = '<h3>小測結果與解釋</h3>';
  let totalCorrect = 0;
  let totalQ = 0;

  // 重組
  html += '<h4>重組句子</h4>';
  q.reorder.forEach((idx, i) => {
    const data = reorderData[idx];
    const list = document.getElementById(`target${quizId}_${i}`);
    const user = Array.from(list.children).map(c => c.textContent).join('');
    const isCorrect = user === data.answer;
    if (isCorrect) totalCorrect++;
    totalQ++;
    html += `<p>第 ${i+1} 題：${isCorrect ? '<span class="correct">正確</span>' : '<span class="wrong">錯誤</span>'}<br>
      <div class="answer-line">你的答案：${user}</div>
      <div class="answer-line">正確答案：${data.answer}</div>
      解釋：${data.explain}</p>`;
    saveLog({ section: `小測${quizId}-重組`, correct: isCorrect, detail: `第${i+1}題：${isCorrect ? '正確' : user}` });
  });

  // 排句
  html += '<h4>排句成段</h4>';
  q.para.forEach((idx, i) => {
    const data = paraData[idx];
    const list = document.getElementById(`para${quizId}_${i}`);
    const user = Array.from(list.children).map(c => c.dataset.key).join(' ');
    const isCorrect = user === data.answer;
    if (isCorrect) totalCorrect++;
    totalQ++;
    html += `<p>第 ${i+1} 題：${isCorrect ? '<span class="correct">正確</span>' : '<span class="wrong">錯誤</span>'}<br>
      你的順序：${user}<br>正確順序：${data.answer}<br>解釋：${data.explain}</p>`;
    saveLog({ section: `小測${quizId}-排句`, correct: isCorrect, detail: `第${i+1}題：${user}` });
  });

  // 閱讀
  html += '<h4>閱讀理解</h4>';
  q.readings.forEach((idx, ri) => {
    const r = readings[idx];
    r.questions.forEach((qq, qi) => {
      let userAns = '';
      let isCorrect = false;
      if (qq.type === 'fill') {
        userAns = document.getElementById(`ans${quizId}_${ri}_${qi}`).value.trim();
        isCorrect = userAns === qq.ans;
      } else {
        const sel = document.querySelector(`input[name="q${quizId}_${ri}_${qi}"]:checked`);
        userAns = sel ? sel.value : '未選擇';
        isCorrect = userAns === qq.ans;
      }
      if (isCorrect) totalCorrect++;
      totalQ++;
      html += `<p>閱讀${ri+1} 第 ${qi+1} 題：${isCorrect ? '<span class="correct">正確</span>' : '<span class="wrong">錯誤</span>'}<br>
        你的答案：${userAns}<br>正確答案：${qq.ans}<br>解釋：${qq.explain}</p>`;
      saveLog({ section: `小測${quizId}-閱讀`, correct: isCorrect, detail: `閱讀${ri+1} 第${qi+1}題：${userAns}` });
    });
  });

  html = `<div class="score">小測 ${quizId} 得分：${totalCorrect}/${totalQ}</div>` + html;
  document.getElementById(`q${quizId}result`).innerHTML = html;
  document.getElementById(`q${quizId}result`).classList.add('show');
}

// 初始化
window.onload = function() {
  initQuiz(1);
  initQuiz(2);
  renderDashboard();
};
