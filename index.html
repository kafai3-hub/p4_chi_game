<!DOCTYPE html>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
* { box-sizing: border-box; }
body { font-family: "PingFang HK", "Microsoft JhengHei", sans-serif; margin: 0; background: #f5f7fa; color: #333; }
header { background: #2c3e50; color: white; padding: 1rem; text-align: center; }
nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin: 1rem; }
nav button { padding: 0.7rem 1.2rem; border: none; background: #3498db; color: white; border-radius: 6px; cursor: pointer; font-size: 1rem; }
nav button.active { background: #2980b9; }
.section { display: none; max-width: 900px; margin: 1rem auto; padding: 1rem; background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.section.active { display: block; }
h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 0.4rem; }

.answer-line { background: #e8f6f3; border: 2px dashed #27ae60; }
.answer-line:empty::before { content: "把詞語拖到這裡"; color: #95a5a6; font-style: italic; }
.drag-item { background: #fff; padding: 0.6rem 0.9rem; border: 1px solid #3498db; border-radius: 6px; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
.drag-item:active { cursor: grabbing; }
button.submit { background: #27ae60; color: white; padding: 0.8rem 1.5rem; border: none; border-radius: 6px; font-size: 1.1rem; margin: 1rem 0; cursor: pointer; }
.result { margin-top: 1rem; padding: 1rem; background: #e8f6f3; border-radius: 6px; display: none; }
.result.show { display: block; }
.correct { color: #27ae60; font-weight: bold; }
.wrong { color: #e74c3c; font-weight: bold; }
.passage { background: #fff; padding: 1rem; border-left: 4px solid #3498db; margin: 1rem 0; line-height: 1.7; }
.passage p { margin: 0.6rem 0; }
.question { margin: 1rem 0; }
.mcq label { display: block; margin: 0.3rem 0; padding: 0.4rem; background: #f8f9fa; border-radius: 4px; cursor: pointer; }
input[type="text"] { padding: 0.5rem; width: 100%; max-width: 280px; font-size: 1rem; }
.dashboard-card { font-size: 0.85rem; padding: 0.6rem; margin: 0.4rem 0; background: #fff; border: 1px solid #ddd; border-radius: 6px; }
.log-item { font-size: 0.75rem; margin: 0.2rem 0; padding: 0.3rem; background: #fff3cd; border-radius: 4px; }
.score { font-size: 1.1rem; font-weight: bold; }
</style>
</head>
<body>
<header>
  <h1>小四中文小測</h1>
  <p>每一小測：4題重組句子 + 4題排句成段 + 2篇閱讀理解 | Safari 拖曳版</p>
</header>

<nav>
  <button onclick="showSection('quiz1', this)" class="active">小測 1</button>
  <button onclick="showSection('quiz2', this)">小測 2</button>
  <button onclick="showSection('dashboard', this)">答題總結</button>
</nav>

<div id="quiz1" class="section active">
  <h2>小測 1</h2>
  <div id="q1content"></div>
  <button class="submit" onclick="submitQuiz(1)">提交小測 1 並查看答案</button>
  <div id="q1result" class="result"></div>
</div>

<div id="quiz2" class="section">
  <h2>小測 2</h2>

  <button class="submit" onclick="submitQuiz(2)">提交小測 2 並查看答案</button>
  <div id="q2result" class="result"></div>
</div>

<div id="dashboard" class="section">
  <h2 style="font-size:1.1rem;">答題總結</h2>
  <div id="dashContent">載入中...</div>
  <button onclick="clearLogs()" style="font-size:0.85rem; padding:0.4rem 0.8rem; margin-top:0.5rem;">清除所有紀錄</button>
</div>

<script>
const STORAGE_KEY = 'p4chinese_logs';
function getLogs() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
function saveLog(entry) {
  const logs = getLogs();
  logs.push({ ...entry, time: new Date().toLocaleString('zh-HK') });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
}

function showSection(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  const section = document.getElementById(id);
  if (section) section.classList.add('active');
  if (btn) btn.classList.add('active');
  if (id === 'dashboard') renderDashboard();
}

function clearLogs() {
  if (confirm('確定清除所有作答紀錄？')) {
    localStorage.removeItem(STORAGE_KEY);
    renderDashboard();
  }
}

function renderDashboard() {
  const logs = getLogs();
  const div = document.getElementById('dashContent');
  if (!div) return;
  if (logs.length === 0) {
    div.innerHTML = '<p>尚無作答紀錄。</p>';
    return;
  }
  const bySection = {};
  logs.forEach(l => {
    if (!bySection[l.section]) bySection[l.section] = { total: 0, correct: 0, wrongs: [] };
    bySection[l.section].total++;
    if (l.correct) bySection[l.section].correct++;
    else bySection[l.section].wrongs.push(l);
  });
  let html = `<div class="score">總作答次數：${logs.length}</div>`;
  Object.keys(bySection).forEach(sec => {
    const s = bySection[sec];
    const rate = Math.round(s.correct / s.total * 100);
    html += `<div class="dashboard-card"><strong>${sec}</strong><br>正確率：${rate}% (${s.correct}/${s.total})`;
    if (s.wrongs.length) {
      html += '<div style="margin-top:0.4rem;"><small>最近錯誤：</small>';
      s.wrongs.slice(-3).forEach(w => {
        html += `<div class="log-item">${w.time} - ${w.detail || ''}</div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });
  div.innerHTML = html;
}

function initQuiz(quizId) {
  const q = quizzes.find(x => x.id === quizId);
  const cont = document.getElementById(`q${quizId}content`);
  if (!cont) return;
  cont.innerHTML = '';

  // 重組句子
  const reorderPart = document.createElement('div');
  reorderPart.className = 'quiz-part';
  reorderPart.innerHTML = '<h3>一、重組句子（拖曳詞語到下方答題線）</h3>';
  const reorderCont = document.createElement('div');
  reorderPart.appendChild(reorderCont);
  cont.appendChild(reorderPart);

  q.reorder.forEach((idx, i) => {
    const data = reorderData[idx];
    const div = document.createElement('div');
    div.innerHTML = `<h4>第 ${i+1} 題</h4>
      <div class="source-row" id="source${quizId}_${i}"></div>
      <div class="answer-line" id="target${quizId}_${i}"></div>`;
    reorderCont.appendChild(div);

    const source = document.getElementById(`source${quizId}_${i}`);
    const target = document.getElementById(`target${quizId}_${i}`);

    const shuffled = [...data.parts].sort(() => Math.random() - 0.5);
    shuffled.forEach(p => {
      const item = document.createElement('div');
      item.className = 'drag-item';
      item.textContent = p;
      source.appendChild(item);
    });

    const groupName = 'reorder' + quizId + '_' + i;
    new Sortable(source, { group: groupName, animation: 150, ghostClass: 'sortable-ghost' });
    new Sortable(target, { group: groupName, animation: 150, ghostClass: 'sortable-ghost' });
  });

  // 排句成段
  const paraPart = document.createElement('div');
  paraPart.className = 'quiz-part';
  paraPart.innerHTML = '<h3>二、排句成段（拖曳排列）</h3>';
  const paraCont = document.createElement('div');
  paraPart.appendChild(paraCont);
  cont.appendChild(paraPart);

  q.para.forEach((idx, i) => {
    const data = paraData[idx];
    const div = document.createElement('div');
    div.innerHTML = `<h4>第 ${i+1} 題</h4>
      <div class="source-row" id="paraSource${quizId}_${i}"></div>
      <div class="answer-line" id="para${quizId}_${i}"></div>`;
    paraCont.appendChild(div);
    const source = document.getElementById(`paraSource${quizId}_${i}`);
    const target = document.getElementById(`para${quizId}_${i}`);
    const shuffled = [...data.sentences].sort(() => Math.random() - 0.5);
    shuffled.forEach(s => {
      const item = document.createElement('div');
      item.className = 'drag-item';
      item.dataset.key = s.k;
      item.textContent = `${s.k}. ${s.t}`;
      source.appendChild(item);
    });
    const groupName = 'para' + quizId + '_' + i;
    new Sortable(source, { group: groupName, animation: 150, ghostClass: 'sortable-ghost' });
    new Sortable(target, { group: groupName, animation: 150, ghostClass: 'sortable-ghost' });
  });

  // 閱讀理解
  const readPart = document.createElement('div');
  readPart.className = 'quiz-part';
  readPart.innerHTML = '<h3>三、閱讀理解</h3>';
  const readCont = document.createElement('div');
  readPart.appendChild(readCont);
  cont.appendChild(readPart);

  q.readings.forEach((idx, ri) => {
    const r = readings[idx];
    const paras = r.passage.split('\n').filter(p => p.trim());
    const numbered = paras.map((p, pidx) => `<p><strong>第${pidx+1}段</strong>　${p}</p>`).join('');
    let rhtml = `<h4>閱讀 ${ri+1}：${r.title}</h4><div class="passage">${numbered}</div>`;
    r.questions.forEach((qq, qi) => {
      rhtml += `<div class="question"><strong>${qi+1}. ${qq.q}</strong><br>`;
      if (qq.type === 'fill') {
        rhtml += `<input type="text" id="ans${quizId}_${ri}_${qi}" placeholder="請填寫">`;
      } else if (qq.type === 'mcq') {
        qq.options.forEach(opt => {
          const letter = opt[0];
          rhtml += `<label class="mcq"><input type="radio" name="q${quizId}_${ri}_${qi}" value="${letter}"> ${opt}</label>`;
        });
      }
      rhtml += '</div>';
    });
    readCont.innerHTML += rhtml;
  });
}

function submitQuiz(quizId) {
  const q = quizzes.find(x => x.id === quizId);
  let html = '<h3>小測結果與解釋</h3>';
  let totalCorrect = 0;
  let totalQ = 0;

  html += '<h4>重組句子</h4>';
  q.reorder.forEach((idx, i) => {
    const data = reorderData[idx];
    const list = document.getElementById(`target${quizId}_${i}`);
    const user = list ? Array.from(list.children).map(c => c.textContent).join('') : '';
    const isCorrect = user === data.answer;
    if (isCorrect) totalCorrect++;
    totalQ++;
    html += `<p>第 ${i+1} 題：${isCorrect ? '<span class="correct">正確</span>' : '<span class="wrong">錯誤</span>'}<br>
      你的答案：${user}<br>正確答案：${data.answer}<br>解釋：${data.explain}</p>`;
    saveLog({ section: `小測${quizId}-重組`, correct: isCorrect, detail: `第${i+1}題：${user}` });
  });

  html += '<h4>排句成段</h4>';
  q.para.forEach((idx, i) => {
    const data = paraData[idx];
    const list = document.getElementById(`para${quizId}_${i}`);
    const user = list ? Array.from(list.children).map(c => c.dataset.key).join(' ') : '';
    const isCorrect = user === data.answer;
    if (isCorrect) totalCorrect++;
    totalQ++;
    html += `<p>第 ${i+1} 題：${isCorrect ? '<span class="correct">正確</span>' : '<span class="wrong">錯誤</span>'}<br>
      你的順序：${user}<br>正確順序：${data.answer}<br>解釋：${data.explain}</p>`;
    saveLog({ section: `小測${quizId}-排句`, correct: isCorrect, detail: `第${i+1}題：${user}` });
  });

  html += '<h4>閱讀理解</h4>';
  q.readings.forEach((idx, ri) => {
    const r = readings[idx];
    r.questions.forEach((qq, qi) => {
      let userAns = '';
      let isCorrect = false;
      if (qq.type === 'fill') {
        const el = document.getElementById(`ans${quizId}_${ri}_${qi}`);
        userAns = el ? el.value.trim() : '';
        isCorrect = userAns === qq.ans;
      } else {
        const sel = document.querySelector(`input[name="q${quizId}_${ri}_${qi}"]:checked`);
        userAns = sel ? sel.value : '未選擇';
        isCorrect = userAns === qq.ans;
      }
      if (isCorrect) totalCorrect++;
      totalQ++;
      html += `<p>閱讀${ri+1} 第 ${qi+1} 題：${isCorrect ? '<span class="correct">正確</span>' : '<span class="wrong">錯誤</span>'}<br>
        你的答案：${userAns}<br>正確答案：${qq.ans}<br>解釋：${qq.explain}</p>`;
      saveLog({ section: `小測${quizId}-閱讀`, correct: isCorrect, detail: `閱讀${ri+1} 第${qi+1}題：${userAns}` });
    });
  });

  html = `<div class="score">小測 ${quizId} 得分：${totalCorrect}/${totalQ}</div>` + html;
  const resultDiv = document.getElementById(`q${quizId}result`);
  if (resultDiv) {
    resultDiv.innerHTML = html;
    resultDiv.classList.add('show');
  }
}

window.onload = function() {
  try {
    initQuiz(1);
    initQuiz(2);
    renderDashboard();
  } catch(e) {
    console.error(e);
    alert('載入時出現問題，請重新整理頁面。');
  }
};
